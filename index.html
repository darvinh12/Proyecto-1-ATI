<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" sizes="32x32" href="./icon/logo-32x32.png" />
    <title>ATI[UCV]Log 2026-1</title>
    <script src="./data/index.json" defer></script>
    <script src="./js/index.js" defer></script>
    <script src="./js/menu.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="nav">
        <a href="./index.html" class="nav-logo">
          <span id="logo-ati"></span>
          <span id="logo-ucv"></span>
          <span id="logo-log"></span>
        </a>

        <div class="buscador">
          <input id="busqueda-input" type="text" placeholder="" />
          <button id="busqueda-boton" type="submit"></button>
        </div>
        
        <div class="nav-perfil">
          <span id="perfil-texto" class="perfil-texto"></span>
          <div class="nav-icono">
            <img
              id="user-icono"
              src="./icon/userIcon.svg"
              alt="Icono de Perfil"
              class="user-icono"
            />
          </div>
        </div>

        <button class="menu-ham" aria-label="Abrir menú">
          <img src="./icon/menuIcon.svg" alt="Menú" />
        </button>
      </nav>
    </header>

    <h1 id="semestre"></h1>

    <section id="perfiles" class="perfiles"></section>

    <footer id="footer"></footer>
  </body>
</html>
