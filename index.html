<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATI[UCV]Log 2026-1</title>

    <style>
        @import url("./Apoyo/css/_theme.css");

        body {
            margin: 0;
            font-size: 18px;
            justify-content: center;
        }

        .nav {
            background-color: var(--main-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            color: var(--white);
        }

        .nav-logo {
            font-size: 48px;
            font-weight: bold;
            font-family: var(--primary-font);
            display: flex;
            align-items: baseline;
        }

        .logo-ucv {
            font-size: 32px;
            font-weight: normal;
        }

        .buscador {
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            width: 400px;
            height: 45px;
        }

        .buscador input {
            border: none;
            padding: 10px;
            flex-grow: 1;
            outline: none;
        }

        .buscador button {
            background-color: #1a2b3c;
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }

        .nav-icono {
            background-color: var(--accent-color);
            padding: 5px;
            border-radius: 50px;
        }

        .user-icono {
            width: 45px;
            height: 45px;
        }

        .semestre {
            padding: 0px 50px;
            font-family: var(--primary-font);
            color: var(--grey-950);
            font-size: 42px;
        }

        .perfiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 20px 50px;
        }

        .tarjeta-perfil {
            text-decoration: none;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .contenedor-img-perfil {
            height: 400px;
        }

        .imagen-perfil {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contenedor-info-perfil {
            margin: 0;
            color: var(--grey-800);
            font-family: var(--primary-font);
            padding: 0px 10px;
        }

        .barra-inferior {
            height: 25px;
            background-color: var(--main-color);
        }

        footer{
            text-align: center;
            color: var(--grey-200);
            padding: 50px;
            border-top: solid;
        }
    </style>
</head>

<body>
    <header>
        <nav class="nav">
            <div class="nav-logo">
                <span class="logo-ati">ATI</span>
                <span class="logo-ucv">[UCV]</span>
                <span class="logo-log">Log</span>
            </div>

            <div class="buscador">
                <input type="text" placeholder="Nombre...">
                <button type="submit">Buscar</button>
            </div>

            <div class="nav-icono">
                <img src="./Apoyo/icon/userIcon.svg" alt="Icono de Perfil" class="user-icono">
            </div>
        </nav>
    </header>

    <h1 class="semestre">Semestre 2026-1</h1>

    <section class="perfiles">
        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./26111803/26111803.png" alt="Darvin Hernández" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Darvin Hernández</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./Apoyo/Dummies/Dummy1.png" alt="Helena Torres" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Helena Torres</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./Apoyo/Dummies/Dummy2.png" alt="Carlos Blanco" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Carlos Blanco</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./Apoyo/Dummies/Dummy3.png" alt="Juan Gutierrez" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Juan Gutierrez</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./Apoyo/Dummies/Dummy4.png" alt="Isabel Contreras" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Isabel Contreras</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

        <a href="#" class="tarjeta-perfil">
            <div class="contenedor-img-perfil">
                <img src="./Apoyo/Dummies/Dummy5.png" alt="Gabriel Vargas" class="imagen-perfil">
            </div>
            <div class="contenedor-info-perfil">
                <h3>Gabriel Vargas</h3>
            </div>
            <div class="barra-inferior"></div>
        </a>

    </section>

    <footer>
        Copyright © 2026 Escuela de
        computación - ATI. Todos los derechos reservados 
    </footer>
</body>

</html>
